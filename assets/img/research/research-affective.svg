<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b509ac"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5fc"/><stop offset="1" stop-color="#f1e8f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="18" fill="url(#bg)"/>

  <!-- Video: face -->
  <g transform="translate(60,40)">
    <rect width="190" height="70" rx="12" fill="#fff" stroke="#3d3d4e" stroke-width="2.5"/>
    <circle cx="38" cy="35" r="22" fill="#fde9c9" stroke="#3d3d4e" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="2.8" fill="#3d3d4e"/><circle cx="46" cy="30" r="2.8" fill="#3d3d4e"/>
    <path d="M28,42 Q38,51 48,42" fill="none" stroke="#3d3d4e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="74" y="42" font-size="16" fill="#3d3d4e" font-weight="600">Video</text>
  </g>
  <!-- Audio -->
  <g transform="translate(60,125)">
    <rect width="190" height="70" rx="12" fill="#fff" stroke="#3d3d4e" stroke-width="2.5"/>
    <g stroke="#378add" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="30" x2="18" y2="40"/><line x1="28" y1="20" x2="28" y2="50"/><line x1="38" y1="26" x2="38" y2="44"/>
      <line x1="48" y1="14" x2="48" y2="56"/><line x1="58" y1="24" x2="58" y2="46"/>
    </g>
    <text x="74" y="42" font-size="16" fill="#3d3d4e" font-weight="600">Audio</text>
  </g>
  <!-- Physiological -->
  <g transform="translate(60,210)">
    <rect width="190" height="70" rx="12" fill="#fff" stroke="#3d3d4e" stroke-width="2.5"/>
    <path d="M12,36 h10 l6,-18 l8,34 l6,-26 l5,10 h12" fill="none" stroke="#e24b4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="74" y="42" font-size="16" fill="#3d3d4e" font-weight="600">EEG / ECG</text>
  </g>
  <!-- Text -->
  <g transform="translate(60,295)">
    <rect width="190" height="70" rx="12" fill="#fff" stroke="#3d3d4e" stroke-width="2.5"/>
    <g stroke="#1d9e75" stroke-width="4" stroke-linecap="round">
      <line x1="16" y1="24" x2="58" y2="24"/><line x1="16" y1="35" x2="50" y2="35"/><line x1="16" y1="46" x2="56" y2="46"/>
    </g>
    <text x="74" y="42" font-size="16" fill="#3d3d4e" font-weight="600">Text</text>
  </g>

  <!-- arrows to fusion -->
  <g fill="none" stroke="#b509ac" stroke-width="2.5">
    <path d="M252,75 C300,75 310,180 350,192" marker-end="url(#ar)"/>
    <path d="M252,160 C295,160 310,192 350,196" marker-end="url(#ar)"/>
    <path d="M252,245 C295,245 310,206 350,204" marker-end="url(#ar)"/>
    <path d="M252,330 C300,330 310,218 350,208" marker-end="url(#ar)"/>
  </g>

  <!-- Fusion network -->
  <g transform="translate(355,110)">
    <rect width="170" height="180" rx="18" fill="#b509ac"/>
    <g stroke="#fff" stroke-opacity=".45" stroke-width="1.5">
      <line x1="45" y1="50" x2="125" y2="40"/><line x1="45" y1="50" x2="125" y2="90"/><line x1="45" y1="50" x2="125" y2="140"/>
      <line x1="45" y1="90" x2="125" y2="40"/><line x1="45" y1="90" x2="125" y2="90"/><line x1="45" y1="90" x2="125" y2="140"/>
      <line x1="45" y1="130" x2="125" y2="40"/><line x1="45" y1="130" x2="125" y2="90"/><line x1="45" y1="130" x2="125" y2="140"/>
    </g>
    <g fill="#fff"><circle cx="45" cy="50" r="9"/><circle cx="45" cy="90" r="9"/><circle cx="45" cy="130" r="9"/>
      <circle cx="125" cy="40" r="9"/><circle cx="125" cy="90" r="9"/><circle cx="125" cy="140" r="9"/></g>
    <text x="85" y="170" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">Multimodal fusion</text>
  </g>
  <path d="M528,200 L572,200" stroke="#b509ac" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Outputs -->
  <g transform="translate(580,95)" font-size="16" fill="#3d3d4e">
    <text x="0" y="16" font-weight="600">Emotion</text>
    <rect x="0" y="26" width="170" height="12" rx="6" fill="#e8dcee"/><rect x="0" y="26" width="128" height="12" rx="6" fill="#b509ac"/>
    <text x="0" y="86" font-weight="600">Engagement</text>
    <rect x="0" y="96" width="170" height="12" rx="6" fill="#e8dcee"/><rect x="0" y="96" width="92" height="12" rx="6" fill="#378add"/>
    <text x="0" y="156" font-weight="600">Personality</text>
    <rect x="0" y="166" width="170" height="12" rx="6" fill="#e8dcee"/><rect x="0" y="166" width="146" height="12" rx="6" fill="#1d9e75"/>
  </g>
</svg>
