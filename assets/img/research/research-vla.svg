<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b509ac"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5fc"/><stop offset="1" stop-color="#f1e8f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="18" fill="url(#bg)"/>

  <!-- Vision: camera -->
  <g transform="translate(70,70)">
    <rect x="0" y="18" width="120" height="78" rx="12" fill="#fff" stroke="#3d3d4e" stroke-width="3"/>
    <rect x="36" y="6" width="40" height="16" rx="4" fill="#3d3d4e"/>
    <circle cx="60" cy="57" r="26" fill="#fff" stroke="#3d3d4e" stroke-width="3"/>
    <circle cx="60" cy="57" r="13" fill="#b509ac" opacity=".85"/>
    <text x="60" y="124" text-anchor="middle" font-size="18" fill="#3d3d4e" font-weight="600">Vision</text>
  </g>

  <!-- Language: speech bubble -->
  <g transform="translate(40,230)">
    <path d="M0,14 a14,14 0 0 1 14,-14 h152 a14,14 0 0 1 14,14 v46 a14,14 0 0 1 -14,14 h-110 l-22,20 v-20 h-20 a14,14 0 0 1 -14,-14 z"
          fill="#fff" stroke="#3d3d4e" stroke-width="3"/>
    <text x="90" y="44" text-anchor="middle" font-size="16" fill="#3d3d4e" font-style="italic">"pick up the red block"</text>
    <text x="90" y="128" text-anchor="middle" font-size="18" fill="#3d3d4e" font-weight="600">Language</text>
  </g>

  <!-- Model -->
  <path d="M200,125 C250,125 260,190 300,195" fill="none" stroke="#b509ac" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M225,265 C265,265 265,215 300,210" fill="none" stroke="#b509ac" stroke-width="3" marker-end="url(#ar)"/>
  <g transform="translate(305,145)">
    <rect width="180" height="110" rx="16" fill="#b509ac"/>
    <g fill="#fff" opacity=".35">
      <rect x="22" y="22" width="28" height="18" rx="4"/><rect x="58" y="22" width="28" height="18" rx="4"/>
      <rect x="94" y="22" width="28" height="18" rx="4"/><rect x="130" y="22" width="28" height="18" rx="4"/>
    </g>
    <text x="90" y="72" text-anchor="middle" font-size="24" fill="#fff" font-weight="700">VLA model</text>
    <text x="90" y="95" text-anchor="middle" font-size="13" fill="#fff" opacity=".9">robot foundation policy</text>
  </g>
  <path d="M488,200 L548,200" stroke="#b509ac" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Action: robot arm -->
  <g>
    <line x1="545" y1="346" x2="770" y2="346" stroke="#c9bcd2" stroke-width="4" stroke-linecap="round"/>
    <rect x="590" y="318" width="90" height="26" rx="7" fill="#3d3d4e"/>
    <line x1="635" y1="318" x2="620" y2="205" stroke="#5a5a70" stroke-width="20" stroke-linecap="round"/>
    <line x1="620" y1="205" x2="712" y2="168" stroke="#5a5a70" stroke-width="16" stroke-linecap="round"/>
    <line x1="712" y1="168" x2="722" y2="236" stroke="#5a5a70" stroke-width="12" stroke-linecap="round"/>
    <circle cx="635" cy="318" r="13" fill="#b509ac"/>
    <circle cx="620" cy="205" r="12" fill="#b509ac"/>
    <circle cx="712" cy="168" r="10" fill="#b509ac"/>
    <line x1="706" y1="240" x2="740" y2="240" stroke="#3d3d4e" stroke-width="6" stroke-linecap="round"/>
    <line x1="708" y1="240" x2="708" y2="276" stroke="#3d3d4e" stroke-width="6" stroke-linecap="round"/>
    <line x1="738" y1="240" x2="738" y2="276" stroke="#3d3d4e" stroke-width="6" stroke-linecap="round"/>
    <rect x="712" y="252" width="22" height="22" rx="3" fill="#e24b4a"/>
    <rect x="746" y="322" width="22" height="22" rx="3" fill="#378add"/>
    <text x="660" y="380" text-anchor="middle" font-size="18" fill="#3d3d4e" font-weight="600">Action</text>
  </g>
</svg>
