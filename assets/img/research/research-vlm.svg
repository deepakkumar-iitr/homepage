<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b509ac"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5fc"/><stop offset="1" stop-color="#f1e8f6"/>
    </linearGradient>
    <clipPath id="pic"><rect x="0" y="0" width="170" height="120" rx="10"/></clipPath>
  </defs>
  <rect width="800" height="400" rx="18" fill="url(#bg)"/>

  <!-- Image input -->
  <g transform="translate(55,55)">
    <g clip-path="url(#pic)">
      <rect width="170" height="120" fill="#cfe6fb"/>
      <circle cx="130" cy="32" r="16" fill="#f5c04a"/>
      <path d="M0,120 L55,55 L95,95 L125,68 L170,120 z" fill="#1d9e75"/>
      <path d="M0,120 L55,55 L75,78 L40,120 z" fill="#15785a"/>
    </g>
    <rect width="170" height="120" rx="10" fill="none" stroke="#3d3d4e" stroke-width="3"/>
    <text x="85" y="150" text-anchor="middle" font-size="18" fill="#3d3d4e" font-weight="600">Image</text>
  </g>

  <!-- Text tokens -->
  <g transform="translate(55,250)" font-size="14" fill="#3d3d4e">
    <rect x="0" y="0" width="52" height="32" rx="8" fill="#fff" stroke="#3d3d4e" stroke-width="2"/><text x="26" y="21" text-anchor="middle">What</text>
    <rect x="58" y="0" width="30" height="32" rx="8" fill="#fff" stroke="#3d3d4e" stroke-width="2"/><text x="73" y="21" text-anchor="middle">is</text>
    <rect x="94" y="0" width="30" height="32" rx="8" fill="#fff" stroke="#3d3d4e" stroke-width="2"/><text x="109" y="21" text-anchor="middle">in</text>
    <rect x="130" y="0" width="40" height="32" rx="8" fill="#fff" stroke="#3d3d4e" stroke-width="2"/><text x="150" y="21" text-anchor="middle">it?</text>
    <text x="85" y="62" text-anchor="middle" font-size="18" font-weight="600">Text</text>
  </g>

  <g fill="none" stroke="#b509ac" stroke-width="3">
    <path d="M230,115 C275,115 280,180 318,188" marker-end="url(#ar)"/>
    <path d="M230,266 C275,266 280,218 318,212" marker-end="url(#ar)"/>
  </g>

  <!-- Transformer stack -->
  <g transform="translate(322,90)">
    <rect x="0" y="0" width="160" height="220" rx="18" fill="#b509ac"/>
    <g fill="#fff" opacity=".9">
      <rect x="22" y="24" width="116" height="30" rx="8"/>
      <rect x="22" y="66" width="116" height="30" rx="8"/>
      <rect x="22" y="108" width="116" height="30" rx="8"/>
      <rect x="22" y="150" width="116" height="30" rx="8"/>
    </g>
    <g font-size="13" fill="#b509ac" text-anchor="middle" font-weight="600">
      <text x="80" y="44">cross-attention</text><text x="80" y="86">self-attention</text>
      <text x="80" y="128">cross-attention</text><text x="80" y="170">self-attention</text>
    </g>
    <text x="80" y="206" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">VLM</text>
  </g>
  <path d="M485,200 L528,200" stroke="#b509ac" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Output answer -->
  <g transform="translate(535,140)">
    <path d="M0,14 a14,14 0 0 1 14,-14 h192 a14,14 0 0 1 14,14 v78 a14,14 0 0 1 -14,14 h-192 a14,14 0 0 1 -14,-14 z"
          fill="#fff" stroke="#3d3d4e" stroke-width="3"/>
    <text x="110" y="44" text-anchor="middle" font-size="16" fill="#3d3d4e" font-style="italic">"Green mountains under</text>
    <text x="110" y="68" text-anchor="middle" font-size="16" fill="#3d3d4e" font-style="italic">a sunny sky."</text>
    <text x="110" y="140" text-anchor="middle" font-size="18" fill="#3d3d4e" font-weight="600">Understanding</text>
  </g>
</svg>
